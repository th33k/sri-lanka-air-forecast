name: Refresh Forecast Data

# Pulls the latest daily dataset and rebuilds data/zone_daily.csv.gz so the
# dashboard always forecasts from the most recent day. Models are not retrained.

on:
  schedule:
    # Once a day, 05:00 Sri Lanka time (23:30 UTC), 2 h after the dataset update
    # (which takes ~15-20 min).
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-repo-commits
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v5

      - name: Checkout dataset
        uses: actions/checkout@v5
        with:
          repository: th33k/dataset-sri-lanka-air-quality
          path: dataset  # the dataset repo is public, so no token is needed
          sparse-checkout: data/processed

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/workflows/refresh_data.yml  # deps are pinned inline below

      - name: Install dependencies
        run: pip install "pandas>=2.2" "numpy>=2.0"

      - name: Rebuild zone tables
        run: python -m src.prepare_data dataset/data/processed

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dsd_zones.csv data/zone_daily.csv.gz
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh forecast data $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
